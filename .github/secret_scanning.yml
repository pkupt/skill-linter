# GitHub Secret Scanning configuration
# https://docs.github.com/code-security/secret-scanning/using-advanced-secret-scanning-and-push-protection/secret-scanning-exclusions
#
# The test suite intentionally contains fake "sk-" shaped tokens to verify the
# linter's hardcoded-secret detection. They are not real credentials.
# Exclude the test directory from scanning to avoid false-positive alerts.
paths-ignore:
  - tests/
