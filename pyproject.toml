[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-linter"
version = "0.1.0"
description = "Lint Agent Skills (SKILL.md) for spec compliance, quality, and security — the eslint for agent skills"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]
keywords = ["agent", "skills", "SKILL.md", "linter", "agentskills", "LLM"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
skill-lint = "skill_linter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[tool.setuptools]
packages = ["skill_linter", "skill_linter.rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
